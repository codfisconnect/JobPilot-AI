name: Automatic Job Source Sync

on:
  schedule:
    # Run automatically every 30 minutes (twice per hour, e.g. :00 and :30 UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync-job-sources:
    name: Sync All Connected Job Sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Automated Job Source Sync on Pilot Mama Backend
        env:
          API_URL: ${{ secrets.PILOT_MAMA_API_URL || 'https://jobpilot-ai-backend-a8h6.onrender.com' }}
          CRON_SECRET: ${{ secrets.JOB_SYNC_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::JOB_SYNC_CRON_SECRET is not configured in repository secrets."
            exit 1
          fi

          echo "Triggering automated job sources sync on: $API_URL/api/v1/internal/job-sources/sync-all"

          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "$API_URL/api/v1/internal/job-sources/sync-all" \
            -H "Content-Type: application/json" \
            -H "x-job-sync-secret: $CRON_SECRET" \
            --connect-timeout 30 \
            --max-time 600)

          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)

          echo "Response HTTP Status: $HTTP_STATUS"
          echo "Sync Summary:"
          echo "$HTTP_BODY"

          if [ "$HTTP_STATUS" -eq 401 ] || [ "$HTTP_STATUS" -eq 403 ]; then
            echo "::error::Authentication failed ($HTTP_STATUS). Verify JOB_SYNC_CRON_SECRET in GitHub Repository Secrets matches Render production backend environment."
            exit 1
          elif [ "$HTTP_STATUS" -eq 502 ] || [ "$HTTP_STATUS" -eq 503 ] || [ "$HTTP_STATUS" -eq 504 ]; then
            echo "::error::Production backend unavailable or timed out ($HTTP_STATUS) at $API_URL."
            exit 1
          elif [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Automated sync failed with HTTP status $HTTP_STATUS"
            exit 1
          fi

          echo "Automatic job source synchronization completed successfully."
