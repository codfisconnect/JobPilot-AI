name: CI Pipeline

on:
  push:
    branches: [ develop, main, 'feature/**' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: pilot_mama_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Root & Backend Dependencies
        run: |
          npm ci || npm install
          cd backend && npm install

      - name: Prisma Validate & Generate
        run: |
          cd backend
          npx prisma validate
          npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/pilot_mama_test?schema=public

      - name: Apply Migrations
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/pilot_mama_test?schema=public

      - name: Run Backend Tests
        run: |
          cd backend
          npm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/pilot_mama_test?schema=public
          NODE_ENV: test

      - name: Build Backend
        run: |
          cd backend
          npm run build

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
